services:
  db:
    image: postgres:latest
    container_name: regional_data_management_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '${DATABASE_PORT}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data # Persist PostgreSQL data
    networks:
      - regional_data_management_network
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER}']
      interval: 10s
      retries: 5
      timeout: 5s
    restart: always

  redis:
    image: redis:alpine
    container_name: regional-data-management-redis
    command: ['redis-server']
    ports:
      - '${REDIS_PORT}:6379'
    networks:
      - regional_data_management_network
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    volumes:
      - redis_data:/data
    restart: always

networks:
  regional_data_management_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
